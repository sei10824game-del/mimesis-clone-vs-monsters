name: Build

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stub build (no game required)
        run: dotnet build CloneVsMonsters/CloneVsMonsters.csproj -c Release -p:SkipGameRefs=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloneVsMonsters-stub
          path: CloneVsMonsters/bin/Release/netstandard2.1/CloneVsMonsters.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build CloneVsMonsters/CloneVsMonsters.csproj -c Release -p:SkipGameRefs=true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: CloneVsMonsters/bin/Release/netstandard2.1/CloneVsMonsters.dll
          generate_release_notes: true
